name: test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Apple Silicon: importing mechbench_core pulls mlx, which only
    # runs on macOS arm64. The pure-block tests need no model weights.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . pytest
      - run: python -m pytest tests/ -q
